<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>liquor memo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37;
  --bg:#0b0b0b;
  --text:#f5f5f5;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Noto Serif JP',serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.8;
}

.background{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.95));
  z-index:-1;
}

header{
  text-align:center;
  padding:60px 20px 30px;
}

header h1{
  color:var(--gold);
  letter-spacing:4px;
  font-size:2rem;
}

header p{
  color:#999;
  margin-top:8px;
}

.content{
  max-width:1000px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.content h1{
  color:var(--gold);
  letter-spacing:4px;
  font-size:1.5rem;
}

.content p{
  color:#999;
  margin: top 8px;
  font-size:1.5rem;
}

footer{
  text-align:center;
  padding:40px 20px;
  color:#777;
  font-size:.75rem;
  border-top:1px solid rgba(255,255,255,.08);
}

footer p{
  margin:4px 0;
}
</style>
</head>

<body>

<div class="background"></div>

<header>
  <h1>簡易年代判別</h1>
  <p>Liquor Notes & Knowledge Base</p>
</header>

<main class="content">
    <h1>あ</h1>
    <p>あ</p>
    あ
</main>

</div>

<footer>
  <p>© 2026 ukabu.marimo tk HP</p>
  <p>
    掲載内容には誤記・表記ゆれ・情報更新の遅延が含まれる場合があります。
  </p>
  <p>
    商品名・商標・ボトルデザイン等の権利は各権利者に帰属します。
  </p>
</footer>

</body>
</html>
